spring:
  application:
    name: tripmate-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

tripmate:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-min-32-chars-long!!}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  config:
    master-key: ${CONFIG_MASTER_KEY:dev-master-key}
    cache-minutes: 5
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:disjeejix}
    api-key: ${CLOUDINARY_API_KEY:361641924281332}
    api-secret: ${CLOUDINARY_API_SECRET:6gxRX7MqlWfDabRX3vnaQQBb8BQ}

logging:
  level:
    com.tripmate: INFO
    org.hibernate.SQL: WARN
